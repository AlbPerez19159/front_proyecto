<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Árboles 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⌬</span>
        <span>Tree<em>3D</em></span>
      </div>
      <div class="header-sub">Generador paramétrico para impresión · v3.2</div>
    </div>
  </header>

  <div class="app">

    <aside class="panel">

      <section class="panel-section">
        <div class="section-title">Especie</div>
        <div class="select-group">
          <select id="tipo" class="select-input">
            <option value="roble">Roble (Quercus robur)</option>
            <option value="eucalipto">Eucalipto (Eucalyptus globulus)</option>
            <option value="pino">Pino insigne (Pinus radiata)</option>
            <option value="palmera">Palmera (Cocos nucifera)</option>
            <option value="araucaria">Araucaria (A. araucana)</option>
            <option value="muerto">Árbol muerto</option>
          </select>
        </div>

        <div class="select-group trunk-type-group" id="trunk-type-group" hidden>
          <div class="section-title trunk-type-label">Tipo de tronco</div>
          <div class="trunk-switch">
            <button type="button" class="switch-btn active" data-trunk="recto">Recto</button>
            <button type="button" class="switch-btn" data-trunk="natural">Natural</button>
          </div>
          <div class="switch-hint">El natural se curva como crecen en libertad</div>
        </div>
      </section>

      <section class="panel-section">
        <div class="section-title">Parámetros</div>

        <div class="slider-group">
          <div class="slider-row">
            <label for="altura">Altura <span class="unit">mm</span></label>
            <input type="number" class="num-input" id="num-altura" min="20" max="200" value="80">
          </div>
          <input type="range" id="altura" min="20" max="200" value="80">
        </div>

        <div class="slider-group">
          <div class="slider-row">
            <label for="tronco">Grosor tronco</label>
            <input type="number" class="num-input" id="num-tronco" min="1" max="20" value="5">
          </div>
          <input type="range" id="tronco" min="1" max="20" value="5">
        </div>

        <div class="slider-group">
          <div class="slider-row">
            <label for="ramas">Niveles de ramas</label>
            <input type="number" class="num-input" id="num-ramas" min="3" max="7" value="5">
          </div>
          <input type="range" id="ramas" min="3" max="7" value="5">
        </div>

        <div class="slider-group" id="densidad-group">
          <div class="slider-row">
            <label for="densidad">Densidad follaje</label>
            <input type="number" class="num-input" id="num-densidad" min="0" max="10" value="7">
          </div>
          <input type="range" id="densidad" min="0" max="10" value="7">
        </div>

        <div class="select-group hojas-group" id="hojas-group" hidden>
          <div class="section-title hojas-label">Hojas</div>
          <div class="trunk-switch">
            <button type="button" class="switch-btn hojas-btn active" data-hojas="true">Con hojas</button>
            <button type="button" class="switch-btn hojas-btn" data-hojas="false">Sin hojas</button>
          </div>
        </div>
      </section>

      <section class="panel-section">
        <div class="section-title">Escala de impresión</div>
        <div class="select-group">
          <select id="escala" class="select-input">
            <option value="87">1:87 HO (ferroviario)</option>
            <option value="72">1:72</option>
            <option value="48">1:48 O</option>
            <option value="35">1:35 (militar)</option>
          </select>
        </div>
      </section>

      <section class="panel-section">
        <div class="section-title">Envío por correo</div>
        <input type="email" id="correo" class="text-input" placeholder="tu@correo.cl">
      </section>

      <div class="panel-actions">
        <button id="btn-generar" class="btn btn-primary">
          <span class="btn-icon">⚙</span>
          <span>Generar STL</span>
        </button>
        <button id="btn-descargar" class="btn btn-secondary" disabled>
          <span class="btn-icon">↓</span>
          <span>Descargar modelo</span>
        </button>
        <div id="status" class="status hidden"></div>
      </div>
    </aside>

    <main class="viewer">
      <div class="viewer-badges">
        <span class="badge" id="badge-especie">Roble</span>
        <span class="badge" id="badge-escala">1:87 HO</span>
        <span class="badge" id="badge-altura">80mm</span>
        <span class="badge" id="badge-altura-real">≈ 6.9 m real</span>
      </div>
      <canvas id="canvas3d"></canvas>
      <div id="aviso-altura" class="viewer-aviso hidden">⚠ Supera el máximo real de la especie</div>
      <div class="viewer-hint">arrastra para rotar · rueda para zoom</div>
    </main>

  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Motor 3D compartido -->
  <script src="js/treeViewer.js"></script>

  <!-- Módulo de cada especie -->
  <script src="js/trees/roble.js"></script>
  <script src="js/trees/pino.js"></script>
  <script src="js/trees/palmera.js"></script>
  <script src="js/trees/eucalipto.js"></script>
  <script src="js/trees/araucaria.js"></script>
  <script src="js/trees/muerto.js"></script>

  <!-- Lógica principal -->
  <script src="js/main.js"></script>
</body>
</html>
